name: Android APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APKs
        run: ./gradlew HostApp:assembleDebug ClientApp:assembleDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks-debug
          path: |
            HostApp/build/outputs/apk/debug/*.apk
            ClientApp/build/outputs/apk/debug/*.apk
