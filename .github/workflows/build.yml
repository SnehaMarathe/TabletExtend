name: Android APK
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK (API 34 + Build-Tools 34.0.0)
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      # Install Gradle 8.7 (AGP 8.5.2 needs Gradle 8.7)
      - name: Install Gradle 8.7
        run: |
          curl -s "https://get.sdkman.io" | bash
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install gradle 8.7
          echo "$HOME/.sdkman/candidates/gradle/current/bin" >> $GITHUB_PATH
          gradle --version

      - name: Build debug APKs (Host & Client)
        run: |
          gradle --no-daemon --stacktrace \
            HostApp:assembleDebug \
            ClientApp:assembleDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks-debug
          path: |
            HostApp/build/outputs/apk/debug/*.apk
            ClientApp/build/outputs/apk/debug/*.apk
