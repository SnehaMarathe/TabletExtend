name: Android APK
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Use Gradle without needing ./gradlew in the repo
      - name: Build Host & Client debug APKs
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.7
          arguments: |
            HostApp:assembleDebug
            ClientApp:assembleDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks-debug
          path: |
            HostApp/build/outputs/apk/debug/*.apk
            ClientApp/build/outputs/apk/debug/*.apk
